<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Réglages 5D</title><style>
:root{--bg:#f5f5f5;--card:#fff;--text:#111;--muted:#666;--line:#d9d9d9;--accent:#111;--warn:#fff2cc;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:760px;margin:0 auto;padding:14px 12px 30px}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.cam{font-size:28px}.title{font-weight:800;font-size:22px}.sub{font-size:13px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.select,.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;font-size:16px}.favbtn{min-width:48px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:24px}.search{grid-column:1/-1}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-size:13px}.pill.active{background:#111;color:#fff;border-color:#111}
.hero{background:#111;color:#fff;border-radius:14px;padding:14px;margin:10px 0}.scene{font-weight:800;font-size:21px;margin-bottom:12px}.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{border-top:1px solid #555;padding-top:7px}.label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#aaa}.value{font-size:20px;font-weight:800;line-height:1.15;margin-top:3px;word-break:break-word}
.grid{display:grid;grid-template-columns:1fr;gap:9px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.card .value{font-size:16px}.tip{border-left:4px solid #111}.note{background:var(--warn);border-color:#e7c55f}.tiny{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
.empty{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
@media(min-width:560px){.quad{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:1fr 1fr}}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1c;--text:#f5f5f5;--muted:#aaa;--line:#3a3a3a;--accent:#fff;--warn:#443b1b}.select,.search,.favbtn,.pill{background:#1c1c1c;color:#f5f5f5}.hero{background:#f5f5f5;color:#111}.hero .label{color:#555}.hero .metric{border-color:#bbb}.pill.active{background:#f5f5f5;color:#111;border-color:#f5f5f5}}
</style></head>
<body><main class="app">
<div class="top"><div class="cam">📷</div><div><div class="title">Réglages 5D Mark IV</div><div class="sub">Fiche terrain — fonctionne hors connexion</div></div></div>
<div class="controls"><select id="scene" class="select" aria-label="Type de prise de vue"></select><button id="fav" class="favbtn" aria-label="Ajouter aux favoris" title="Favori">☆</button><input id="search" class="search" type="search" placeholder="Rechercher : avion, nuit, Case 5…" aria-label="Rechercher"></div>
<div class="pills"><button class="pill active" data-filter="all">Tous</button><button class="pill" data-filter="fav">★ Favoris</button><button class="pill" data-filter="servo">AI Servo</button><button class="pill" data-filter="manual">Manuel</button></div>
<div id="empty" class="empty">Aucune situation ne correspond à ce filtre.</div>
<section id="view">
<div class="hero"><div id="sceneTitle" class="scene"></div><div class="quad">
<div class="metric"><div class="label">Mode</div><div id="mode" class="value"></div></div><div class="metric"><div class="label">Ouverture</div><div id="ouverture" class="value"></div></div><div class="metric"><div class="label">Vitesse</div><div id="vitesse" class="value"></div></div><div class="metric"><div class="label">ISO</div><div id="iso" class="value"></div></div>
</div></div>
<div class="grid">
<div class="card"><div class="label">AF / Mesure</div><div id="af_mesure" class="value"></div></div><div class="card"><div class="label">Zone / suivi AF + Case</div><div id="zone" class="value"></div></div><div class="card"><div class="label">Style d’image</div><div id="style" class="value"></div></div><div class="card"><div class="label">Flash</div><div id="flash" class="value"></div></div><div class="card tip" style="grid-column:1/-1"><div class="label">Astuce rapide</div><div id="astuce" class="value"></div></div><div id="sourceNote" class="card note" style="grid-column:1/-1;display:none"><div class="label">À vérifier</div><div id="sourceNoteText" class="value"></div></div>
</div></section>
<div class="tiny">Données reprises de ton tableau Canon 5D Mark IV.</div>
</main>
<script>

 "ouverture": "f/4–5.6", "vitesse": "auto", "iso": "Auto (max 6400)", "af_mesure": "One Shot / Évaluative", "style": "Standard", "astuce": "RAW + contraste", "flash": "E-TTL urbain léger", "zone": "1 collimateur / Zone AF si sujet mobile – Case 1", "source_note": ""}, {"type": "Ambiance tamisée", "mode": "Av", "ouverture": "f/2–2.8", "vitesse": "≥ 1/60 s", "iso": "1600–6400", "af_mesure": "One Shot / Évaluative", "style": "Neutre", "astuce": "Sous-expo –0,3 IL", "flash": "—", "zone": "1 collimateur", "source_note": ""}, {"type": "Pose longue / eau", "mode": "M", "ouverture": "f/11–16", "vitesse": "1/2–10 s", "iso": "100", "af_mesure": "Manuel / Évaluative", "style": "Neutre", "astuce": "Filtre ND + trépied", "flash": "—", "zone": "— Mise au point manuelle", "source_note": ""}, {"type": "Voie lactée / étoiles", "mode": "M", "ouverture": "f/2.8", "vitesse": "~20 s", "iso": "3200–6400", "af_mesure": "Manuel / —", "style": "Neutre", "astuce": "Règle 500, pas d’IS", "flash": "—", "zone": "— Mise au point manuelle", "source_note": ""}, {"type": "Concert / spectacle", "mode": "M ou Av", "ouverture": "f/2.8", "vitesse": "1/200–1/500 s", "iso": "3200–12800", "af_mesure": "AI Servo / Évaluative", "style": "Neutre", "astuce": "HSS utile si flash", "flash": "E-TTL scène", "zone": "Zone AF ou extension 8 collimateurs – Case 2", "source_note": ""}, {"type": "Église / sombre", "mode": "Av", "ouverture": "f/4–8", "vitesse": "auto", "iso": "1600–3200", "af_mesure": "One Shot / Évaluative", "style": "Neutre", "astuce": "Trépied si possible", "flash": "E-TTL léger", "zone": "1 collimateur", "source_note": ""}, {"type": "Groupe", "mode": "Av", "ouverture": "f/5.6–8", "vitesse": "auto", "iso": "Auto", "af_mesure": "One Shot / Large", "style": "Standard", "astuce": "Focus sur 1er rang", "flash": "E-TTL large", "zone": "1 collimateur – sur le 1er rang", "source_note": ""}, {"type": "Soirée / fête", "mode": "M", "ouverture": "f/2.8–4", "vitesse": "1/60–1/125 s", "iso": "1600–6400", "af_mesure": "AI Servo / Évaluative", "style": "Standard ou Neutre", "astuce": "Shoote RAW, garde un peu de lumière ambiante pour l’atmosphère", "flash": "E-TTL II, rebond plafond, –1/3 IL, synchro 2ᵉ rideau", "zone": "Zone AF – Case 4", "source_note": ""}, {"type": "Soirée statique", "mode": "TV", "ouverture": "1/60", "vitesse": ">400", "iso": "2e rideau", "af_mesure": "Flash vers l'arrière 24mm", "style": "—", "astuce": "—", "flash": "synchro 2ᵉ rideau", "zone": "1 collimateur", "source_note": "Cette ligne semble décalée dans le fichier Excel d’origine : réglages à vérifier."}, {"type": "Sport avec obstacles / sujet masqué", "mode": "Tv", "ouverture": "auto", "vitesse": "1/1000–1/2000 s", "iso": "Auto (max 6400)", "af_mesure": "AI Servo / Évaluative", "style": "Standard", "astuce": "Garder le collimateur sur le sujet initial ; rafale haute", "flash": "—", "zone": "Zone AF ou extension 8 collimateurs – Case 2", "source_note": ""}, {"type": "Sujet surgissant brusquement", "mode": "Tv", "ouverture": "auto", "vitesse": "1/1000–1/2000 s", "iso": "Auto (max 6400)", "af_mesure": "AI Servo / Évaluative", "style": "Standard", "astuce": "Pré-cadrer la zone d’arrivée ; rafale haute", "flash": "—", "zone": "Zone AF / Grande zone AF – Case 3", "source_note": ""}, {"type": "Course / cyclisme / véhicule accélérant", "mode": "Tv", "ouverture": "auto", "vitesse": "1/1000–1/2000 s", "iso": "Auto (max 6400)", "af_mesure": "AI Servo / Évaluative", "style": "Standard", "astuce": "Suivre avant le déclenchement ; rafale haute", "flash": "—", "zone": "Zone AF ou extension 8 collimateurs – Case 4", "source_note": ""}, {"type": "Tennis / chien – direction imprévisible", "mode": "Tv", "ouverture": "auto", "vitesse": "1/1000–1/2000 s", "iso": "Auto (max 6400)", "af_mesure": "AI Servo / Évaluative", "style": "Standard", "astuce": "Laisser de l’espace autour du sujet pour faciliter le suivi", "flash": "—", "zone": "Sélection auto 61 collimateurs / Zone AF – Case 5", "source_note": ""}, {"type": "Oiseaux en vol / animal très rapide", "mode": "Tv", "ouverture": "f/5.6–8", "vitesse": "1/1600–1/3200 s", "iso": "Auto (max 6400)", "af_mesure": "AI Servo / Évaluative", "style": "Standard", "astuce": "Rafale haute ; commencer le suivi avant de déclencher", "flash": "—", "zone": "Sélection auto 61 collimateurs / Grande zone AF – Case 6", "source_note": ""}];
const $=id=>document.getElementById(id); const scene=$('scene'), search=$('search'), fav=$('fav'), view=$('view'), empty=$('empty');
let currentFilter='all'; let favorites=[]; try{favorites=JSON.parse(localStorage.getItem('reglages5d_favs')||'[]')}catch(e){favorites=[]}
function norm(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function matches(d){const q=norm(search.value); const text=norm(Object.values(d).join(' ')); if(q && !text.includes(q)) return false; if(currentFilter==='fav'&&!favorites.includes(d.type))return false; if(currentFilter==='servo'&&!norm(d.af_mesure).includes('ai servo'))return false; if(currentFilter==='manual'&&!norm(d.af_mesure+' '+d.zone).includes('manuel'))return false; return true}
function fillOptions(keep=true){const old=scene.value; const filtered=DATA.filter(matches); scene.innerHTML=''; filtered.forEach(d=>{const o=document.createElement('option');o.value=d.type;o.textContent=d.type;scene.appendChild(o)}); if(keep&&filtered.some(d=>d.type===old))scene.value=old; else if(filtered.length)scene.value=filtered[0].type; empty.style.display=filtered.length?'none':'block'; view.style.display=filtered.length?'block':'none'; if(filtered.length) render();}
function render(){const d=DATA.find(x=>x.type===scene.value); if(!d)return; ['mode','ouverture','vitesse','iso','af_mesure','zone','style','flash','astuce'].forEach(k=>$(k).textContent=d[k]||'—'); $('sceneTitle').textContent=d.type; fav.textContent=favorites.includes(d.type)?'★':'☆'; fav.setAttribute('aria-label',favorites.includes(d.type)?'Retirer des favoris':'Ajouter aux favoris'); if(d.source_note){$('sourceNote').style.display='block';$('sourceNoteText').textContent=d.source_note}else $('sourceNote').style.display='none';}
scene.addEventListener('change',render); search.addEventListener('input',()=>fillOptions(false)); fav.addEventListener('click',()=>{const t=scene.value;if(!t)return; favorites=favorites.includes(t)?favorites.filter(x=>x!==t):[...favorites,t]; localStorage.setItem('reglages5d_favs',JSON.stringify(favorites)); if(currentFilter==='fav')fillOptions(false); else render();});
document.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;fillOptions(false)}));
fillOptions(false);

</script></body></html>
